[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edm-phrase-detect"
version = "0.1.0"
description = "Offline, explainable phrase detection for mostly 4/4 electronic dance music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "soundfile",
  "librosa",
  "matplotlib",
  "pytest",
  "mir_eval",
]

[project.optional-dependencies]
optional = [
  "pandas",
  "ruptures",
]

[tool.setuptools.packages.find]
include = ["edm_phrase_detect*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]
